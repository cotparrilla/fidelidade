<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E9E1CC">
<title>Meus dados · Clube Cotito</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,300;6..72,400&family=Instrument+Sans:wght@400;500;600&family=Xanh+Mono&display=swap">
<link rel="stylesheet" href="cotito.css">
</head>
<body>
<main id="conteudo"><p class="carregando">Carregando…</p></main>

<script src="config.js"></script>
<script>
const SERVER = window.COTITO_API;
const alvo = document.getElementById("conteudo");
const ehIOS = /iPhone|iPad|iPod/.test(navigator.userAgent);
const CHAVE_TEL = "bb_meu_telefone";
const LOGO = '<img class="logo" src="logo_cotito_preto.png" alt="Cotito">';

function esc(s){ return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

function mascararTelefone(input){
  input.addEventListener("input", () => {
    let d = input.value.replace(/\D/g, "").slice(0, 11), f = d;
    if(d.length > 2) f = "(" + d.slice(0,2) + ") " + d.slice(2);
    if(d.length > 7) f = "(" + d.slice(0,2) + ") " + d.slice(2,7) + "-" + d.slice(7);
    input.value = f;
  });
}

function telaEntrar(erroInicial){
  alvo.innerHTML = `
    ${LOGO}
    <h1>Meus pontos</h1>
    <p class="sub">Digite seu telefone para ver sua cartela e suas indicações.</p>
    <div class="campo">
      <label for="e-tel">TELEFONE</label>
      <input id="e-tel" type="tel" inputmode="numeric" autocomplete="tel" placeholder="(21) 99999-9999">
    </div>
    <button class="btn" id="e-entrar">Ver meus pontos</button>
    <div class="erro" id="e-erro">${erroInicial || ""}</div>
  `;
  const tel = document.getElementById("e-tel");
  mascararTelefone(tel);
  document.getElementById("e-entrar").onclick = async () => {
    const t = tel.value.replace(/\D/g, ""), erro = document.getElementById("e-erro");
    if(t.length < 10 || t.length > 11){ erro.textContent = "Confira o DDD e o número."; return; }
    erro.textContent = "";
    const b = document.getElementById("e-entrar"); b.disabled = true; b.textContent = "Buscando…";
    await buscarEMostrar("55" + t, erro, b);
  };
}

async function buscarEMostrar(tel, erroEl, btnEl){
  const falha = msg => {
    if(erroEl){ erroEl.textContent = msg; if(btnEl){ btnEl.disabled = false; btnEl.textContent = "Ver meus pontos"; } }
    else telaEntrar(msg);
  };
  try{
    const r = await fetch(SERVER + "/consumidor/" + tel);
    if(r.status === 404){
      try{ localStorage.removeItem(CHAVE_TEL); }catch(e){}
      falha("Não achamos esse telefone. Confira o número ou faça seu cadastro no balcão.");
      return;
    }
    if(!r.ok) throw 0;
    const c = await r.json();
    try{ localStorage.setItem(CHAVE_TEL, tel); }catch(e){}
    mostrar(c);
  }catch(e){ falha("Sem conexão. Tente de novo."); }
}

function trilha(r){
  // posição de cada degrau proporcional ao último (o último fica na ponta)
  const brindes = r.brindes || [];
  if(!brindes.length) return "";
  const max = brindes[brindes.length - 1].qtd;
  const feito = Math.min(100, (r.indicacoes / max) * 100);
  const marcos = brindes.map(b => `
    <div class="marco ${b.conquistado ? "ok" : ""}" style="left:${(b.qtd / max) * 100}%">
      <i></i><small>${esc(b.nome)} · ${b.qtd}</small>
    </div>`).join("");
  return `<div class="trilha"><div class="base"></div><div class="feito" style="width:${feito}%"></div>${marcos}</div>`;
}

function frase(r){
  const conquistados = (r.brindes || []).filter(b => b.conquistado);
  const pend = r.brindes_pendentes || [];
  const partes = [];
  if(pend.length) partes.push(`${pend[0].nome} conquistado: retire no balcão.`);
  else if(conquistados.length) partes.push(`${conquistados[conquistados.length - 1].nome} conquistado.`);
  if(r.proximo_brinde) partes.push(`Faltam ${r.proximo_brinde.qtd - r.indicacoes} para o brinde ${r.proximo_brinde.nome}.`);
  return partes.join(" ") || "Todos os brindes conquistados. Obrigado por trazer os amigos!";
}

function mostrar(c){
  const r = c.resumo || {};
  const pontos = r.punches ?? c.punches ?? 0, meta = r.meta ?? c.meta ?? 10;
  const dots = Array.from({length: meta}, (_, i) => `<i class="${i < pontos ? "on" : ""}"></i>`).join("");

  let status = `Faltam ${meta - pontos} para o executivo por nossa conta.`;
  if(r.premio_pendente) status = "Executivo grátis liberado! Mostre o cartão no balcão.";

  const wallet = ehIOS
    ? `<a class="wallet" href="${SERVER}/cartao/${c.telefone}">Abrir na Apple Wallet</a>`
    : `<a class="wallet g" href="${SERVER}/gwallet/${c.telefone}">Abrir no Google Wallet</a>`;

  alvo.innerHTML = `
    ${LOGO}
    <h1>Oi, ${esc(c.nome || "membro")}</h1>
    ${r.mate_pendente ? `<div class="destaque"><b>Mate da casa</b>Seu mate ainda está te esperando. Mostre o cartão no balcão.</div>` : ""}

    <div class="bloco">
      <div class="t"><span class="mono">Executivos</span><span class="n">${pontos}/${meta}</span></div>
      <div class="dots" aria-label="${pontos} de ${meta} pontos">${dots}</div>
      <span style="font-size:14px">${status}</span>
    </div>

    <div class="bloco">
      <div class="t"><span class="mono">Indicações</span><span class="n">${r.indicacoes ?? 0}</span></div>
      ${trilha(r)}
      <span style="font-size:14px">${esc(frase(r))}</span>
    </div>

    <div class="caixa"><img src="boi_preto.png" alt=""><span>Mostre o QR do seu cartão para um amigo. Quando ele pegar o mate, a indicação conta para você.</span></div>

    ${wallet}
    <button class="btn claro" id="b-trocar">Ver outro telefone</button>
  `;
  document.getElementById("b-trocar").onclick = () => {
    try{ localStorage.removeItem(CHAVE_TEL); }catch(e){}
    telaEntrar();
  };
}

/* ══ início ══ */
(function(){
  // vindo do link "Meus dados" do cartão: perfil.html?tel=5521999998888
  const p = new URLSearchParams(location.search);
  const telUrl = (p.get("tel") || "").replace(/\D/g, "");
  if(telUrl.length >= 12){
    history.replaceState(null, "", location.pathname);   // tira o telefone da barra
    buscarEMostrar(telUrl, null, null);
    return;
  }
  let salvo = null;
  try{ salvo = localStorage.getItem(CHAVE_TEL); }catch(e){}
  if(salvo) buscarEMostrar(salvo, null, null); else telaEntrar();
})();
</script>
</body>
</html>
