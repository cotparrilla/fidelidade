steps:
  # 1. Constrói a imagem a partir do dockerfile na raiz
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'southamerica-east1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/fidelidade:$COMMIT_SHA'
      - '-t'
      - 'southamerica-east1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/fidelidade:latest'
      - '.'

  # 2. Envia a imagem para o Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '--all-tags'
      - 'southamerica-east1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/fidelidade'

  # 3. Implanta no Cloud Run (o passo que faltava)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'fidelidade'
      - '--image=southamerica-east1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/fidelidade:$COMMIT_SHA'
      - '--region=southamerica-east1'
      - '--platform=managed'

images:
  - 'southamerica-east1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/fidelidade:$COMMIT_SHA'
  - 'southamerica-east1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/fidelidade:latest'

options:
  logging: CLOUD_LOGGING_ONLY
