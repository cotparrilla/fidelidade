<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFD13B">
<title>Clube Cotito</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,300;6..72,400&family=Instrument+Sans:wght@400;500;600&family=Xanh+Mono&display=swap">
<link rel="stylesheet" href="cotito.css">
</head>
<body class="amarelo">
<main id="conteudo"><p class="carregando">Carregando…</p></main>

<script src="config.js"></script>
<script>
const SERVER = window.COTITO_API;

const q     = new URLSearchParams(location.search);
const bar   = q.get("indicador") || q.get("bar") || "cotito";
const ind   = (q.get("padrinho") || q.get("ind") || "").replace(/\D/g, "");
const colab = q.get("colab") || "";

const alvo = document.getElementById("conteudo");
const ehIOS = /iPhone|iPad|iPod/.test(navigator.userAgent);
const LOGO = '<img class="logo" src="logo_cotito_preto.png" alt="Cotito">';

function esc(s){ return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function primeiroNome(n){ return String(n || "").trim().split(/\s+/)[0]; }

/*
 * Este aparelho já fez um cadastro? Pede só o telefone para achar o cartão,
 * em vez do formulário completo (evita gente pegando mate de novo).
 */
if(localStorage.getItem("bb_ja_cadastrou")) telaRecuperar();
else formulario();

function mascararTelefone(input){
  input.addEventListener("input", () => {
    let d = input.value.replace(/\D/g, "").slice(0, 11), f = d;
    if(d.length > 2) f = "(" + d.slice(0,2) + ") " + d.slice(2);
    if(d.length > 7) f = "(" + d.slice(0,2) + ") " + d.slice(2,7) + "-" + d.slice(7);
    input.value = f;
  });
}

function telaRecuperar(){
  alvo.innerHTML = `
    ${LOGO}
    <h1>Você já tem cartão?</h1>
    <p class="sub">Este celular já fez um cadastro no Clube Cotito. Confirme seu telefone para abrir o seu cartão.</p>
    <div class="campo">
      <label for="r-tel">TELEFONE</label>
      <input id="r-tel" type="tel" inputmode="numeric" autocomplete="tel" placeholder="(21) 99999-9999">
    </div>
    <button class="btn" id="r-enviar">Abrir meu cartão</button>
    <div class="erro" id="r-erro"></div>
  `;
  const tel = document.getElementById("r-tel");
  mascararTelefone(tel);
  document.getElementById("r-enviar").onclick = async () => {
    const t = tel.value.replace(/\D/g, ""), erro = document.getElementById("r-erro");
    if(t.length < 10 || t.length > 11){ erro.textContent = "Confira o DDD e o número."; return; }
    erro.textContent = "";
    const b = document.getElementById("r-enviar"); b.disabled = true; b.textContent = "Procurando…";
    try{
      const r = await fetch(SERVER + "/consumidor/55" + t);
      if(r.status === 404){ formulario(); return; }   // número novo: segue para o cadastro
      if(!r.ok) throw 0;
      jaTemCartao(await r.json());
    }catch(e){
      erro.textContent = "Sem conexão. Tente de novo.";
    }finally{ b.disabled = false; b.textContent = "Abrir meu cartão"; }
  };
}

async function nomePadrinho(){
  if(!ind) return "";
  try{
    const r = await fetch(SERVER + "/consumidor/" + ind);
    if(!r.ok) return "";
    return primeiroNome((await r.json()).nome);
  }catch(e){ return ""; }
}

async function formulario(){
  const dias = Array.from({length:31}, (_,i) => `<option value="${i+1}">${i+1}</option>`).join("");
  const meses = ["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto",
                 "Setembro","Outubro","Novembro","Dezembro"].map((m,i) => `<option value="${i+1}">${m}</option>`).join("");

  alvo.innerHTML = `
    ${LOGO}
    <span class="etiqueta mono" id="f-indicado" hidden></span>
    <h1>O mate da casa é por nossa conta.</h1>
    <p class="sub">Três respostas rápidas e ele é seu. Depois, cada executivo vira ponto. No 10º, o executivo é nosso.</p>

    <div class="campo">
      <label for="f-nome">NOME</label>
      <input id="f-nome" type="text" autocomplete="given-name" placeholder="Seu primeiro nome">
    </div>
    <div class="campo">
      <label for="f-tel">TELEFONE</label>
      <input id="f-tel" type="tel" inputmode="numeric" autocomplete="tel" placeholder="(21) 99999-9999">
    </div>
    <div class="campo">
      <label for="f-dia">ANIVERSÁRIO</label>
      <div class="dupla">
        <select id="f-dia" aria-label="Dia"><option value="" disabled selected>Dia</option>${dias}</select>
        <select id="f-mes" aria-label="Mês"><option value="" disabled selected>Mês</option>${meses}</select>
      </div>
    </div>
    <label class="lgpd"><input type="checkbox" id="f-lgpd">
      <span>Aceito que o Cotito guarde meu nome, telefone e aniversário para o clube de pontos. Dá pra sair quando quiser.</span>
    </label>
    <button class="btn" id="f-enviar">Quero meu mate</button>
    <div class="erro" id="f-erro"></div>
  `;

  const tel = document.getElementById("f-tel");
  mascararTelefone(tel);

  nomePadrinho().then(n => {
    const el = document.getElementById("f-indicado");
    if(n && el){ el.textContent = "Indicado por " + n; el.hidden = false; }
  });

  document.getElementById("f-enviar").onclick = () => {
    const nome = document.getElementById("f-nome").value.trim();
    const dia  = document.getElementById("f-dia").value;
    const mes  = document.getElementById("f-mes").value;
    let t = tel.value.replace(/\D/g, "");
    const erro = document.getElementById("f-erro");

    if(!nome){ erro.textContent = "Escreva seu nome."; return; }
    if(t.length < 10 || t.length > 11){ erro.textContent = "Confira o DDD e o número do telefone."; return; }
    if(!dia || !mes){ erro.textContent = "Escolha o dia e o mês do aniversário."; return; }
    if(!document.getElementById("f-lgpd").checked){ erro.textContent = "Marque o aceite para entrar no clube."; return; }

    erro.textContent = "";
    const b = document.getElementById("f-enviar"); b.disabled = true; b.textContent = "Entrando…";
    cadastrar("55" + t, primeiroNome(nome), dia, mes).finally(() => {
      if(document.body.contains(b)){ b.disabled = false; b.textContent = "Quero meu mate"; }
    });
  };
}

async function cadastrar(tel, nome, dia, mes){
  // o último pedaço do endereço era o "time" na base; não é mais usado
  let url = SERVER + "/cadastro/" + encodeURIComponent(bar) + "/" + tel + "/" +
            encodeURIComponent(nome) + "/" + dia + "/" + mes + "/-";
  const extras = [];
  if(ind && ind !== tel) extras.push("padrinho=" + ind);
  if(colab) extras.push("colab=" + encodeURIComponent(colab));
  if(extras.length) url += "?" + extras.join("&");

  const erro = document.getElementById("f-erro");
  try{
    const r = await fetch(url);
    const d = await r.json();
    if(d.status === "nao_permitido"){ erro.textContent = d.motivo || "Cadastro não disponível."; return; }
    if(d.status === "ja_cadastrado"){ jaTemCartao(d.consumidor); return; }
    if(d.status !== "cadastrado"){ erro.textContent = "Não deu para concluir. Tente de novo."; return; }
    pronto(d.consumidor);
  }catch(e){
    erro.textContent = "Sem conexão. Verifique a internet e tente de novo.";
  }
}

function botoesWallet(tel){
  // no iPhone mostra só a Apple; no resto, só o Google
  return ehIOS
    ? `<a class="wallet" href="${SERVER}/cartao/${tel}">Adicionar à Apple Wallet</a>`
    : `<a class="wallet g" href="${SERVER}/gwallet/${tel}">Adicionar ao Google Wallet</a>`;
}

function pronto(c){
  try{ localStorage.setItem("bb_ja_cadastrou", "1"); }catch(e){}
  document.body.classList.remove("amarelo");
  document.querySelector('meta[name="theme-color"]').content = "#E9E1CC";
  alvo.innerHTML = `
    <img class="boi" src="boi_vermelho.png" alt="">
    <h1>Tudo certo, ${esc(c.nome)}.</h1>
    ${botoesWallet(c.telefone)}
    <div class="passo"><b>1</b><span>Salve o cartão na carteira do celular.</span></div>
    <div class="passo"><b>2</b><span>Mostre o cartão no balcão e pegue seu mate.</span></div>
    <div class="passo"><b>3</b><span>A cada executivo, mostre de novo. O ponto entra na hora.</span></div>
    <a class="btn claro" href="perfil.html?tel=${c.telefone}">Ver meus pontos</a>
  `;
}

function jaTemCartao(c){
  try{ localStorage.setItem("bb_ja_cadastrou", "1"); }catch(e){}
  document.body.classList.remove("amarelo");
  document.querySelector('meta[name="theme-color"]').content = "#E9E1CC";
  const r = c.resumo || {};
  let situacao;
  if(r.mate_pendente)        situacao = "Seu mate da casa ainda está te esperando. Mostre o cartão no balcão.";
  else if(r.premio_pendente) situacao = "Você tem um executivo grátis liberado. Mostre o cartão no balcão.";
  else situacao = `Sua cartela está em <strong>${r.punches ?? c.punches ?? 0} de ${r.meta ?? c.meta ?? 10}</strong> pontos.`;
  alvo.innerHTML = `
    ${LOGO}
    <h1>Você já é membro, ${esc(c.nome)}.</h1>
    <div class="destaque"><b>Este telefone já tem cartão</b>${situacao}</div>
    ${botoesWallet(c.telefone)}
    <a class="btn claro" href="perfil.html?tel=${c.telefone}">Ver meus pontos</a>
    <p class="nota">Não é você? Confira o número. Cada telefone tem um único cartão.</p>
  `;
}
</script>
</body>
</html>
