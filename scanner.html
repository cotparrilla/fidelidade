<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#E9E1CC">
<title>Balcão · Clube Cotito</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,300;6..72,400&family=Instrument+Sans:wght@400;500;600&family=Xanh+Mono&display=swap">
<link rel="stylesheet" href="cotito.css">
<style>
  /* Balcão: botões grandes, um toque por ação, leitura de longe. */
  body{overscroll-behavior:none}
  .tela{display:none; min-height:100dvh; flex-direction:column}
  .tela.on{display:flex}
  .cab{display:flex; align-items:center; justify-content:space-between; gap:12px;
       padding:calc(env(safe-area-inset-top,0px) + 14px) 18px 12px; border-bottom:1.5px solid var(--preto)}
  .cab .logo{width:96px}
  .cab .quem{font:400 12px var(--f-mono); text-transform:uppercase; letter-spacing:.06em; text-align:right}
  .sair{background:none; border:1.5px solid var(--preto); font:400 12px var(--f-mono); letter-spacing:.06em;
        text-transform:uppercase; padding:8px 12px; color:var(--preto)}
  .abas{display:flex; border-bottom:1.5px solid var(--preto)}
  .abas button{flex:1; background:none; border:none; padding:12px; font:400 13px var(--f-mono);
               text-transform:uppercase; letter-spacing:.06em; color:var(--suave)}
  .abas button.on{color:var(--preto); box-shadow:inset 0 -3px 0 var(--vermelho)}
  .corpo{flex:1; display:flex; flex-direction:column; gap:14px; padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));
         width:100%; max-width:480px; margin:0 auto}

  #cam{width:100%; aspect-ratio:1; overflow:hidden; background:var(--preto); position:relative}
  #cam video{width:100%!important; height:100%!important; object-fit:cover}
  #cam::after{content:""; position:absolute; inset:14%; border:3px solid var(--amarelo); pointer-events:none}
  .dica{font-family:var(--f-display); font-weight:300; text-transform:uppercase; font-size:26px; line-height:1.05; text-align:center}

  .cli{background:var(--preto); color:var(--creme); padding:16px; display:flex; flex-direction:column; gap:10px}
  .cli .rot{font:400 12px var(--f-mono); text-transform:uppercase; letter-spacing:.06em; color:var(--amarelo)}
  .cli .nome{font-family:var(--f-display); font-weight:300; font-size:34px; line-height:1; text-transform:uppercase; word-break:break-word}
  .cli .dots i{border-color:var(--creme)}
  .cli .dots i.on{background:var(--amarelo); border-color:var(--amarelo)}
  .cli .dots i.novo{background:var(--vermelho); border-color:var(--vermelho)}
  .cli .linha{font-size:15px}

  .acoes{display:flex; flex-direction:column; gap:8px}
  .a{display:flex; justify-content:space-between; align-items:center; gap:10px; width:100%;
     padding:18px 16px; font:400 15px var(--f-mono); text-transform:uppercase; letter-spacing:.05em; text-align:left; border:none}
  .a span:last-child{white-space:nowrap}
  .a.pri{background:var(--amarelo); color:var(--preto)}
  .a.off{background:transparent; color:var(--suave); border:1.5px dashed rgba(28,24,14,.3)}
  .a:disabled{cursor:default}
  .a.pri:active{transform:scale(.99)}
  .bloq{background:var(--vermelho); color:var(--preto); padding:12px 14px; font-size:15px; line-height:1.35}
  .bloq b{display:block; font:400 12px var(--f-mono); text-transform:uppercase; letter-spacing:.06em; margin-bottom:2px}

  .fim{flex:1; display:flex; flex-direction:column; justify-content:center; align-items:center; gap:14px; text-align:center}
  .selo{width:110px; height:110px; border-radius:50%; display:grid; place-items:center; font-size:56px; font-weight:600}
  .selo.ok{background:var(--amarelo); color:var(--preto)}
  .selo.erro{background:var(--vermelho); color:var(--preto)}
  .fim h2{font-family:var(--f-display); font-weight:300; text-transform:uppercase; font-size:34px; line-height:1.05}
  .fim p{font-size:18px; max-width:30ch}

  .feed{display:flex; flex-direction:column; gap:8px}
  .lote{border-bottom:1px solid var(--linha); padding:10px 0}
  .lote .l1{font-weight:600; display:flex; gap:8px; align-items:center; flex-wrap:wrap}
  .lote .l2{font-size:13px; color:var(--suave)}
  .tag{font:400 11px var(--f-mono); text-transform:uppercase; letter-spacing:.05em; padding:2px 8px}
  .tag.ponto{background:var(--amarelo)} .tag.mate{background:var(--azul)}
  .tag.premio{background:var(--vermelho)} .tag.brinde{background:var(--preto); color:var(--creme)}
  .tag.bloq{border:1px solid var(--vermelho); color:#B3261E}
</style>
</head>
<body>

<!-- ══ LOGIN ══ -->
<section id="t-login" class="tela on">
  <main>
    <img class="logo" src="logo_cotito_preto.png" alt="Cotito">
    <h1>Balcão</h1>
    <p class="sub">Entre com o código e a senha que o gerente te passou.</p>
    <div class="campo"><label for="i-id">CÓDIGO</label>
      <input id="i-id" type="text" autocapitalize="none" autocomplete="username" placeholder="ex.: lu"></div>
    <div class="campo"><label for="i-senha">SENHA</label>
      <input id="i-senha" type="password" autocomplete="current-password" placeholder="••••••"></div>
    <div class="erro" id="erro-login"></div>
    <button class="btn" id="b-entrar">Entrar</button>
  </main>
</section>

<!-- ══ ESCANEAR ══ -->
<section id="t-scan" class="tela">
  <div class="cab"><img class="logo" src="logo_cotito_preto.png" alt="Cotito">
    <div style="display:flex;gap:10px;align-items:center"><div class="quem" data-quem></div><button class="sair" data-sair>Sair</button></div></div>
  <div class="abas"><button class="on" data-aba="scan">Escanear</button><button data-aba="atividade">Atividade</button></div>
  <div class="corpo">
    <div id="cam"></div>
    <p class="dica">Aponte para o QR<br>do cartão do cliente</p>
  </div>
</section>

<!-- ══ CLIENTE (o que fazer) ══ -->
<section id="t-cliente" class="tela">
  <div class="cab"><img class="logo" src="logo_cotito_preto.png" alt="Cotito"><div class="quem" data-quem></div></div>
  <div class="corpo">
    <div class="cli">
      <span class="rot">Cliente</span>
      <span class="nome" id="c-nome">—</span>
      <div class="dots" id="c-dots"></div>
      <span class="linha" id="c-linha"></span>
    </div>
    <div id="c-bloq"></div>
    <div class="acoes" id="c-acoes"></div>
    <button class="btn claro" id="b-voltar">Voltar</button>
  </div>
</section>

<!-- ══ RESULTADO ══ -->
<section id="t-fim" class="tela">
  <div class="cab"><img class="logo" src="logo_cotito_preto.png" alt="Cotito"><div class="quem" data-quem></div></div>
  <div class="corpo">
    <div class="fim"><div class="selo" id="f-selo"></div><h2 id="f-titulo"></h2><p id="f-texto"></p></div>
    <button class="btn" id="b-novo">Escanear o próximo</button>
  </div>
</section>

<!-- ══ ATIVIDADE ══ -->
<section id="t-atividade" class="tela">
  <div class="cab"><img class="logo" src="logo_cotito_preto.png" alt="Cotito">
    <div style="display:flex;gap:10px;align-items:center"><div class="quem" data-quem></div><button class="sair" data-sair>Sair</button></div></div>
  <div class="abas"><button data-aba="scan">Escanear</button><button class="on" data-aba="atividade">Atividade</button></div>
  <div class="corpo"><div class="feed" id="feed"><p class="carregando">Carregando…</p></div></div>
</section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<script src="config.js"></script>
<script src="auth.js" data-chaves="bb_garcom,bb_gestor,bb_admin"></script>
<script>
const API = window.COTITO_API;
let garcom = null, leitor = null, cliente = null, telefoneAtual = null;
const $ = id => document.getElementById(id);
const digitos = s => (s || "").replace(/\D/g, "");
function esc(s){ return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function hora(iso){ try{ return new Date(iso).toLocaleTimeString("pt-BR", {hour:"2-digit", minute:"2-digit"}); }catch(e){ return ""; } }
function dataHora(iso){
  try{ const d = new Date(iso);
    return d.toLocaleDateString("pt-BR", {day:"2-digit", month:"2-digit"}) + " " + hora(iso); }catch(e){ return iso || "—"; }
}
function mostrar(qual){
  document.querySelectorAll(".tela").forEach(t => t.classList.remove("on"));
  $("t-" + qual).classList.add("on");
  window.scrollTo(0, 0);
}

/* ── LOGIN ── */
$("b-entrar").onclick = async () => {
  const id = $("i-id").value.trim(), senha = $("i-senha").value;
  if(!id || !senha){ $("erro-login").textContent = "Preencha o código e a senha."; return; }
  $("b-entrar").disabled = true; $("b-entrar").textContent = "Entrando…";
  try{
    const r = await fetch(API + "/login", { method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({id, senha}) });
    const d = await r.json();
    if(!r.ok){
      $("erro-login").textContent = d.erro === "garcom_inativo" ? "Seu acesso está desativado. Fale com o gerente." : "Código ou senha incorretos.";
      return;
    }
    garcom = d;
    localStorage.setItem("bb_garcom", JSON.stringify(d));
    entrar();
  }catch(e){ $("erro-login").textContent = "Sem conexão. Tente de novo."; }
  finally{ $("b-entrar").disabled = false; $("b-entrar").textContent = "Entrar"; }
};
$("i-senha").addEventListener("keydown", ev => { if(ev.key === "Enter") $("b-entrar").click(); });

document.querySelectorAll("[data-sair]").forEach(b => b.onclick = () => {
  try{ localStorage.removeItem("bb_garcom"); }catch(e){}
  pararCamera(); garcom = null; location.href = "login.html";
});
document.querySelectorAll("[data-aba]").forEach(b => b.onclick = () => b.dataset.aba === "scan" ? abrirEscanear() : abrirAtividade());

function entrar(){
  document.querySelectorAll("[data-quem]").forEach(el => el.textContent = garcom.nome || "");
  abrirEscanear();
}

/* ── CÂMERA ── */
function extrairTelefone(texto){
  const m = String(texto).match(/\/q\/(\d{10,13})/);
  return m ? m[1] : digitos(texto);
}
async function iniciarCamera(){
  if(leitor) return;
  leitor = new Html5Qrcode("cam", { verbose:false, formatsToSupport:[Html5QrcodeSupportedFormats.QR_CODE] });
  try{
    await leitor.start({ facingMode:"environment" },
      { fps:10, qrbox:{width:240, height:240}, experimentalFeatures:{ useBarCodeDetectorIfSupported:true } },
      texto => { pararCamera(); consultar(extrairTelefone(texto)); }, () => {});
  }catch(e){
    $("cam").innerHTML = '<p class="carregando" style="color:var(--creme)">Câmera indisponível.<br>Libere o acesso e recarregue.</p>';
    leitor = null;
  }
}
function pararCamera(){
  if(!leitor) return;
  const l = leitor; leitor = null;
  l.stop().catch(()=>{}).finally(() => { try{ l.clear(); }catch(e){} });
}
function abrirEscanear(){ clearInterval(feedTimer); mostrar("scan"); iniciarCamera(); }

/* ── CLIENTE: mostra só o que vale agora ── */
async function consultar(tel){
  telefoneAtual = tel;
  mostrar("cliente");
  $("c-nome").textContent = "Consultando…"; $("c-dots").innerHTML = ""; $("c-linha").textContent = "";
  $("c-bloq").innerHTML = ""; $("c-acoes").innerHTML = "";
  try{
    const r = await fetch(API + "/consumidor/" + tel);
    if(r.status === 404){ concluir(false, "Cartão não encontrado", "Esse cliente não está no Clube Cotito."); return; }
    if(!r.ok) throw 0;
    pintar((await r.json()).resumo);
  }catch(e){ concluir(false, "Sem conexão", "Verifique a internet e tente de novo."); }
}

function pintar(r){
  cliente = r;
  const meta = r.meta || 10, pts = r.punches || 0;
  const bloqueado = !!r.proximo_ponto_em;
  const podePonto = !r.premio_pendente && !bloqueado;

  $("c-nome").textContent = r.nome || "Cliente";
  $("c-dots").innerHTML = Array.from({length: meta}, (_, i) =>
    `<i class="${i < pts ? "on" : (podePonto && i === pts ? "novo" : "")}"></i>`).join("");
  $("c-linha").textContent = r.premio_pendente
    ? "Cartela cheia: tem executivo grátis para entregar."
    : (podePonto ? `${pts} pontos. Com este executivo, vai para ${pts + 1}.` : `${pts} pontos.`);

  $("c-bloq").innerHTML = bloqueado
    ? `<div class="bloq"><b>Ponto já registrado</b>Último ponto às ${hora(r.ultimo_ponto)}. O próximo vale a partir das ${hora(r.proximo_ponto_em)}.</div>`
    : "";

  const brinde = (r.brindes_pendentes || [])[0];
  const acoes = [
    { acao:"ponto", ativo: podePonto, txt:"Pedido com executivo",
      dir: podePonto ? "+1" : (r.premio_pendente ? "cartela cheia" : "a partir das " + hora(r.proximo_ponto_em)) },
    { acao:"mate", ativo: r.mate_pendente, txt:"Mate da casa", dir: r.mate_pendente ? "entregar" : "já retirado" },
    { acao:"premio", ativo: r.premio_pendente, txt:"Executivo grátis", dir: r.premio_pendente ? "entregar" : "no " + meta + "º" },
    { acao:"brinde", ativo: !!brinde, txt: brinde ? "Brinde: " + brinde.nome : "Brinde de indicação",
      dir: brinde ? "entregar" : (r.proximo_brinde ? r.proximo_brinde.nome.toLowerCase() + " em " + r.proximo_brinde.qtd : "—") },
  ];
  // o que vale agora vem primeiro
  acoes.sort((a, b) => (b.ativo ? 1 : 0) - (a.ativo ? 1 : 0));
  $("c-acoes").innerHTML = acoes.map(a =>
    `<button class="a ${a.ativo ? "pri" : "off"}" data-acao="${a.acao}" ${a.ativo ? "" : "disabled"}>
       <span>${esc(a.txt)}</span><span>${esc(a.dir)}</span></button>`).join("");
  $("c-acoes").querySelectorAll("button.pri").forEach(b => b.onclick = () => registrar(b.dataset.acao, b));
}

$("b-voltar").onclick = () => { cliente = null; abrirEscanear(); };

const ERROS = {
  bloqueio_ponto: "O ponto deste cartão já foi registrado há pouco.",
  cartela_cheia: "A cartela está cheia. Entregue o executivo grátis primeiro.",
  mate_ja_retirado: "O mate deste cliente já foi retirado.",
  sem_premio: "Este cliente ainda não tem executivo grátis.",
  sem_brinde: "Não há brinde para entregar.",
  bar_diferente: "Seu acesso é de outra unidade.",
  consumidor_nao_encontrado: "Esse cliente não está no Clube Cotito.",
};
const TITULOS = { ponto:"Ponto registrado", mate:"Entregue o mate", premio:"Entregue o executivo", brinde:"Entregue o brinde" };

async function registrar(acao, botao){
  document.querySelectorAll("#c-acoes button").forEach(b => b.disabled = true);
  botao.querySelector("span:last-child").textContent = "gravando…";
  try{
    const r = await fetch(API + "/scan", {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ telefone: telefoneAtual, garcom_id: garcom.garcom_id || garcom.gestor_id || garcom.admin_id,
                             bar: garcom.bar_id || "cotito", acao })
    });
    const d = await r.json();
    if(!r.ok){
      concluir(false, "Não registrado", ERROS[d.erro] || "Tente de novo.");
      return;
    }
    const titulo = acao === "ponto" && d.recompensa_gerada ? "Cartela fechada!" : TITULOS[acao];
    concluir(true, titulo, d.mensagem_garcom || "");
  }catch(e){
    concluir(false, "Sem conexão", "Nada foi registrado. Tente de novo.");
  }
}

function concluir(ok, titulo, texto){
  $("f-selo").className = "selo " + (ok ? "ok" : "erro");
  $("f-selo").textContent = ok ? "✓" : "!";
  $("f-titulo").textContent = titulo;
  $("f-texto").textContent = texto;
  mostrar("fim");
}
$("b-novo").onclick = abrirEscanear;

/* ── ATIVIDADE (somente leitura) ── */
let feedTimer = null, feedOffset = 0, feedTemMais = true, feedCarregando = false;
function abrirAtividade(){
  pararCamera(); mostrar("atividade"); carregarFeed(true);
  clearInterval(feedTimer); feedTimer = setInterval(() => carregarFeed(true), 30000);
}
window.addEventListener("scroll", () => {
  if(!$("t-atividade").classList.contains("on")) return;
  if(window.innerHeight + window.scrollY >= document.body.scrollHeight - 120) carregarFeed(false);
});
function linhaFeed(e){
  let tag = '<span class="tag ponto">ponto</span>';
  if(e.tipo === "resgate") tag = e.tipo_recompensa === "boas_vindas" ? '<span class="tag mate">mate</span>' : '<span class="tag premio">executivo grátis</span>';
  else if(e.tipo === "brinde") tag = `<span class="tag brinde">${esc(e.brinde || "brinde")}</span>`;
  else if(e.tipo === "ponto_bloqueado") tag = '<span class="tag bloq">ponto recusado (2 h)</span>';
  return `<div class="lote"><div class="l1">${esc(e.nome)} ${tag}</div>
          <div class="l2">${dataHora(e.data)} · ${esc(e.garcom)}</div></div>`;
}
async function carregarFeed(reset){
  if(!garcom || feedCarregando || (!reset && !feedTemMais)) return;
  feedCarregando = true;
  if(reset) feedOffset = 0;
  try{
    const r = await fetch(API + "/bar/" + encodeURIComponent(garcom.bar_id || "cotito") + "/atividade?limite=30&offset=" + feedOffset);
    const d = await r.json();
    const ev = (d.eventos || []).filter(e => !["prato","resgate_prato"].includes(e.tipo));
    if(reset) $("feed").innerHTML = ev.length ? ev.map(linhaFeed).join("") : '<p class="carregando">Nenhuma leitura ainda.</p>';
    else $("feed").insertAdjacentHTML("beforeend", ev.map(linhaFeed).join(""));
    feedOffset += (d.eventos || []).length;
    feedTemMais = !!d.tem_mais;
  }catch(e){
    if(reset) $("feed").innerHTML = '<p class="carregando">Não foi possível carregar.</p>';
  }finally{ feedCarregando = false; }
}

/* ── INÍCIO ── */
(function(){
  // entrada pelo botão "Scanner" do painel do gerente (?gestor_id=...)
  const p = new URLSearchParams(location.search);
  if(p.has("gestor_id")){
    garcom = { garcom_id: p.get("gestor_id"), nome: p.get("nome") || "", bar_id: p.get("bar_id") || "cotito" };
    entrar(); return;
  }
  let salvo = null;
  try{ salvo = localStorage.getItem("bb_garcom"); }catch(e){}
  if(salvo){ try{ garcom = JSON.parse(salvo); entrar(); return; }catch(e){} }
  mostrar("login");
})();
</script>
</body>
</html>
